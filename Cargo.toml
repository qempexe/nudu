[package]
name = "nudu"
version = "0.1.0"
edition = "2024"
description = "nudu (new du): a terminal disk usage analyzer with file ownership, filesystem-aware sizes and age heat"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
rustix = { version = "1.1.5", features = ["fs"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
