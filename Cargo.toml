[package]
name = "nudu"
version = "0.1.0"
edition = "2024"
description = "nudu (new du): a terminal disk usage analyzer with file ownership, filesystem-aware sizes and age heat"
license = "MIT"
readme = "README.md"
repository = "https://github.com/qempexe/nudu"
homepage = "https://github.com/qempexe/nudu"
keywords = ["disk-usage", "du", "tui", "terminal", "btrfs"]
categories = ["command-line-utilities", "filesystem"]
# Oldest Rust that builds nudu (let chains in if/while need 1.88).
rust-version = "1.88"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
rayon = "1.12.0"
rustix = { version = "1.1.5", features = ["fs", "process"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
